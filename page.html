<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Hello Forms</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
  <div>
    <h1>Please provide feedback. (You may do so anonymously.)</h1>
    <form>
      <label for="feedback-n" name="current-name">Name</label>
      <input id="feedback-n" name="current-name" type="text">
      <br>
      <label for="feedback-e" name="current-email">Email</label>
      <input id="feedback-e" name="current-email" type="email">
      <br>
      <label for="feedback-t" name="current-comments">Comments</label>
      <br>
      <textarea required id="feedback-t" name="current-comments"></textarea>
      <br>
  </div>

  <div>
    <br>
    <label name="current-s">Are you a current student?</label>
    <br>

    <label for="feedback-yes"></label>
    <input id="feedback-yes" name="current-s" type="radio" checked>Yes

    <label for="feedback-no"></label>
    <input id="feedback-no" name="current-s" type="radio">No
    <br>
    <input type="submit">
  </div>

  </form>
</body>

</html>
