<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello Forms</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
<div>
<h1>Please provide feedback. (You may do so anonymously.)</h1>
<form>
<label for ="feedback-n">Name</label>
<input id="feedback-n" type="text" >
<br>
<label for ="feedback-e">Email</label>
<input id="feedback-e" type="email">
<br>
<label for ="feedback-t">Comments</label>
<br>
<textarea required id="feedback-t"></textarea>
<br>
</div>

<div>
<br>
<label>Are you a current student?</label>
<br>

<label for="feedback-y"></label>
<input id="feedback-y" type="radio" checked>Yes

<label for="feedback-n"></label>
<input id="feedback-n" type="radio">No
<br>
<input type="submit">
</div>

</form>
</body>
</html>
